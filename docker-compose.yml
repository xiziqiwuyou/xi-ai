services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: xi-ai-docs:local
    container_name: xi-ai-docs
    ports:
      - "${DOCS_PORT:-8080}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
